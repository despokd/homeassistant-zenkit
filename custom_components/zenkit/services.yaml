create_entry:
  target:
    entity:
      integration: zenkit
      domain: todo
  fields:
    name:
      required: true
      example: "Buy milk"
      selector:
        text:
    description:
      example: "2 liters"
      selector:
        text:
          multiline: true
    due_date:
      example: "2026-11-30"
      selector:
        date:
    due_datetime:
      example: "2026-11-30 18:00:00"
      selector:
        datetime:
    status:
      example: "In progress"
      selector:
        text:
    labels:
      example: "Important"
      selector:
        text:
          multiple: true
    assignees:
      example: "Jane Doe"
      selector:
        text:
          multiple: true
