name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, to catch breaking changes in Home Assistant, hassfest and HACS
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  black:
    name: Python Code Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install black
        # Same version as requirements_test.txt, so local checks match CI
        run: pip install "$(grep '^black==' requirements_test.txt)"
      - name: Black Code Format Check
        run: black . --check --diff

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Run pytest
        run: python -m pytest

  hassfest:
    name: Check hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v5
      # Tracks master on purpose: hassfest validates against current Home Assistant rules
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v5
      # Tracks main on purpose: validates against current HACS rules
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
