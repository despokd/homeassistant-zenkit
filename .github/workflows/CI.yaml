name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, to catch breaking changes in Home Assistant, hassfest and HACS
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  black:
    name: Python Code Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install black
        # Same version as requirements_test.txt, so local checks match CI
        run: pip install "$(grep '^black==' requirements_test.txt)"
      - name: Black Code Format Check
        run: black . --check --diff

  test:
    name: Tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Home Assistant, as declared in hacs.json
          - variant: min
            requirements: requirements_test_min.txt
          # Latest Home Assistant release
          - variant: latest
            requirements: requirements_test.txt
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test requirements
        run: pip install -r ${{ matrix.requirements }}
      - name: Check minimum version matches hacs.json
        if: matrix.variant == 'min'
        run: |
          installed=$(pip show homeassistant | sed -n 's/^Version: //p')
          declared=$(python -c "import json; print(json.load(open('hacs.json'))['homeassistant'])")
          echo "Installed Home Assistant $installed, hacs.json declares $declared"
          test "$installed" = "$declared"
      - name: Run pytest
        run: python -m pytest

  hassfest:
    name: Check hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7
      # Tracks master on purpose: hassfest validates against current Home Assistant rules
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7
      # Tracks main on purpose: validates against current HACS rules
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
